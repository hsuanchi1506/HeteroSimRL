[project]
name = "learnability"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy",
    "matplotlib",
    "scipy",
    "pandas",
    "minigrid",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
minigrid = { path = "..", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
